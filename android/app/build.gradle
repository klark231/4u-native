plugins {
    id 'com.android.application'
}

// The .so files come already built (the build script copies them into jniLibs): Gradle only packs them.
// (the signing key: ../keystore.properties and ../mh4u.keystore, never in git; without them the APK can't be signed)
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "com.mh4u.port"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.mh4u.native"
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName "0.1.9.2"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        local {
            storeFile file('../mh4u.keystore')
            storePassword signing['storePassword']
            keyAlias signing['keyAlias']
            keyPassword signing['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
        debug {
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // The public APK carries no game code: every player builds their own on a PC.
            excludes += ['**/libmh4u_code*.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Four builds of the same app: the usual one and three with another package name (some phones' performance modes know a
    // benchmark by its package). The code stays in com.mh4u.port (the namespace); only the package name and the label change.
    // Each package has its own folder in Android/data (its saves too) and cannot be installed over the real benchmark.
    flavorDimensions "pkg"
    productFlavors {
        standard {
            dimension "pkg"
        }
        antutu {
            dimension "pkg"
            applicationId "com.antutu.ABenchMark"
            versionNameSuffix "-antutu"
        }
        ludashi {
            dimension "pkg"
            applicationId "com.ludashi.benchmark"
            versionNameSuffix "-ludashi"
        }
        alt {  // (a second install of the app beside the standard one: its own package, settings, log and saves)
            dimension "pkg"
            applicationId "com.mh4u.native.alt"
            versionNameSuffix "-alt"
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
